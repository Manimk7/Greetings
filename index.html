<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Message For You</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #120008;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.25);
      text-align: center;
      max-width: 90%;
      width: 360px;
      backdrop-filter: blur(8px);
    }

    h2 {
      margin-bottom: 20px;
      color: #ff69b4;
      font-size: 22px;
    }

    input[type="password"] {
      padding: 12px;
      width: 80%;
      border-radius: 8px;
      border: 1.5px solid #ff69b4;
      background: #2a0815;
      color: #fff;
      font-size: 16px;
      text-align: center;
      margin-bottom: 15px;
      outline: none;
      box-sizing: border-box;
    }

    input[type="password"]:focus {
      border-color: #ff1493;
      box-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
    }

    button {
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      background-color: #ff69b4;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #ff1493;
    }

    #error-message {
      color: #ff4d4d;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }

    #image-container {
      display: none;
      margin-top: 20px;
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    #image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(255, 105, 180, 0.4);
    }
  </style>
</head>
<body>

  <div class="card" id="login-box">
    <h2>Enter Passcode ❤️</h2>
    <input type="password" id="password" placeholder="Enter password...">
    <br>
    <button onclick="checkPassword()">Unlock</button>
    <p id="error-message">Incorrect password! Try again.</p>
  </div>

  <div id="image-container">
    <img src="Card.jpg.png" alt="Special Memory">
  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById("password").value;
      const errorMessage = document.getElementById("error-message");
      const loginBox = document.getElementById("login-box");
      const imageContainer = document.getElementById("image-container");

      if (input.trim().toUpperCase() === "MAYA") {
        loginBox.style.display = "none";
        imageContainer.style.display = "block";
      } else {
        errorMessage.style.display = "block";
      }
    }

    document.getElementById("password").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>

</body>
</html>
